org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Publishing goes to the Central Portal. The uploaded bundle is left staged
# rather than released: a staged bundle can be dropped, a released one is on
# Maven Central for good. Set mavenCentralAutomaticPublishing=true to release
# without the click.
mavenCentralPublishing=true

# Signing is required for a release version and skipped for a -SNAPSHOT, which
# is what an untagged commit builds as, so `publishToMavenLocal` needs no key
# and a tagged build cannot go out unsigned.
signAllPublications=true
