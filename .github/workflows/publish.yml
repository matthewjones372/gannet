name: publish

on:
  push:
    # A pre-release tag is not a release: a version on Central is permanent.
    tags: ["v*", "!v*-*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish. Empty: the dispatched ref."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      # The release runs the same gate a push does, io_uring tests included.
      GANNET_REQUIRE_URING: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The version is derived from the nearest `v` tag, and a shallow
          # checkout has no tags to derive it from.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # A dispatch on a branch rather than a tag would build a snapshot, which
      # Central should not be asked for. Fail before the upload.
      - name: Refuse anything but a release
        run: |
          version=$(./gradlew -q currentVersion | sed -n 's/^Project version: //p')
          echo "version: $version"
          case "$version" in
            "") echo "could not read the version"; exit 1 ;;
            *-SNAPSHOT) echo "refusing to publish a snapshot"; exit 1 ;;
            *-*) echo "$version is not a release"; exit 1 ;;
          esac

      # A release that cannot build is worth finding out about before it is on
      # Maven Central for good.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Uploads a bundle to the Central Portal and leaves it staged. Releasing
      # it is a click there: a staged bundle can be dropped, a released one is
      # permanent.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
