name: soak

# Opt-in: a long mixed load on each engine, checking at the end for leaked descriptors, threads, connections and
# buffers, a heap that trends upward, and latency that degrades. Too long for every push; run it by hand before a
# release, and weekly to catch a slow regression.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of load per engine"
        default: "20"
      engines:
        description: "Engines to soak, comma-separated"
        default: "IO_URING,EPOLL"
  schedule:
    # Sundays, 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  soak:
    # A GitHub-hosted VM rather than a container, as in the build: Docker's default seccomp profile refuses io_uring.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        engine: [IO_URING, EPOLL]

    env:
      GANNET_REQUIRE_URING: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Say what the machine is
        run: |
          uname -r
          nproc
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "no io_uring_disabled sysctl"

      - name: Soak ${{ matrix.engine }}
        if: contains(inputs.engines || 'IO_URING,EPOLL', matrix.engine)
        # Through the environment rather than spliced into the script. The server and the load are pinned to halves
        # of the runner's cores by the soak itself.
        env:
          SOAK_MINUTES: ${{ inputs.minutes || '20' }}
          SOAK_ENGINE: ${{ matrix.engine }}
        run: ./gradlew soak --stacktrace -PsoakMinutes="$SOAK_MINUTES" -PsoakEngines="$SOAK_ENGINE"

      - name: Upload the samples and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.engine }}
          path: |
            build/soak/
            !build/soak/*.p12
          retention-days: 30
